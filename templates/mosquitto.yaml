apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-mosquitto
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    listener {{ .Values.mosquitto.port }}
    allow_anonymous {{ .Values.mosquitto.allowAnonymous }}
    persistence true
    persistence_location /mosquitto/data/
---
{{- if .Values.mosquitto.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-mosquitto
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.mosquitto.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-mosquitto
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mosquitto
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mosquitto
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Roll the pods whenever the broker config changes.
        checksum/config: {{ toYaml .Values.mosquitto | sha256sum }}
    spec:
      containers:
        - name: mosquitto
          image: {{ .Values.mosquitto.image }}
          ports:
            - name: mqtt
              containerPort: {{ .Values.mosquitto.port }}
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: {{ include "telemetry-stack.fullname" . }}-mosquitto
        - name: data
        {{- if .Values.mosquitto.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "telemetry-stack.fullname" . }}-mosquitto
        {{- else }}
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-mosquitto
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: mosquitto
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mqtt
      port: {{ .Values.mosquitto.port }}
      targetPort: mqtt
