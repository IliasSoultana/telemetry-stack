apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-grafana
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-grafana-datasources
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "telemetry-stack.fullname" . }}-prometheus:{{ .Values.prometheus.port }}
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-grafana
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "telemetry-stack.fullname" . }}-grafana
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "telemetry-stack.fullname" . }}-grafana
                  key: admin-password
          ports:
            - name: http
              containerPort: {{ .Values.grafana.port }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: {{ include "telemetry-stack.fullname" . }}-grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry-stack.fullname" . }}-grafana
  labels: {{- include "telemetry-stack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.grafana.port }}
      targetPort: http
